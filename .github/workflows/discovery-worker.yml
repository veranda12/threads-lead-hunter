name: Discovery worker (alternatif)

# Alternatif bila satu run melebihi batas durasi function Vercel: pipeline dijalankan langsung
# di runner GitHub. Isi secret DATABASE_URL dkk, lalu jalankan manual. Untuk menjadikannya
# scheduler utama, tambahkan trigger schedule di sini dan nonaktifkan discovery.yml.
on:
  workflow_dispatch: {}

concurrency:
  group: discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run discovery worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run worker:discovery -- --execution-id="${EXECUTION_ID}"
